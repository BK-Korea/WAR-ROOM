version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: war-room-postgres
    environment:
      POSTGRES_DB: war_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: war_room_password_2024
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/db/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
